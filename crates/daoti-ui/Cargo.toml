[package]
name = "daoti-ui"
version = "0.1.0"
edition = "2021"
description = "驭灵玄镜 UI：Web/桌面仪表盘（三环八卦图、决策时间轴、快照回魂）。可选交付，Tauri 宿主 + Bun 前端。"
build = "build.rs"

# 可选交付：默认不启用 Tauri，避免阻塞 M0-M4 主链路（开发计划 §1.2 / §8）
# 启用 `ui` feature 后才编译 Tauri 宿主（需先构建 daoti-ui-web 前端产物到 dist）
[features]
default = []
ui = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[[bin]]
name = "daoti-ui"
path = "src/main.rs"

[dependencies]
daoti-common = { workspace = true }
daoti-core = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Tauri 宿主（可选）：玄镜桌面壳，加载 daoti-ui-web 前端，经 HTTP/SSE 只读 daemon（R8）
tauri = { version = "2", optional = true , features = [] }
# 文件选择对话框（可选）：玄镜「道体·通」选择二进制取绝对路径
rfd = { workspace = true, optional = true }
serde = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
