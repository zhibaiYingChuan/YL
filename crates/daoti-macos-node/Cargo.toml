[package]
name = "daoti-macos-node"
version = "0.1.0"
edition = "2021"
description = "驭灵 macOS 远程执行节点"

[lib]
name = "daoti_macos_node"
path = "src/lib.rs"

[[bin]]
name = "daoti-macos-node"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
daoti-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
