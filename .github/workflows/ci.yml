name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Rust 后端：构建（零警告）、测试、Clippy 静态检查
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: 构建（零警告）
        run: cargo build --workspace

      - name: 生成极简动态 ELF fixture
        shell: bash
        run: |
          zig cc -target x86_64-linux -nostdlib -fPIE -pie \
            -o fixtures/runtime/hello_minimal_dynamic.elf \
            fixtures/runtime/minimal.s
          test -f fixtures/runtime/hello_minimal_dynamic.elf

      - name: 生成真实 ET_DYN fixture（Linux 工具链）
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-et-dyn-fixture.sh
      - name: 生成真实 ET_DYN fixture（Windows，Zig 交叉工具链）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig cc -target x86_64-linux -c -fPIC -nostdlib -o target/et_dyn_console_fixture.o tests/fixtures/et_dyn_console.S
          if ($LASTEXITCODE -ne 0) { throw 'zig cc -c 编译 ET_DYN fixture 失败' }
          zig cc -target x86_64-linux -nostdlib -pie '-Wl,--build-id=none' '-Wl,-e,_start' -o target/et_dyn_console_fixture target/et_dyn_console_fixture.o
          if ($LASTEXITCODE -ne 0) { throw 'zig cc 链接 ET_DYN fixture 失败' }
          Remove-Item -LiteralPath target/et_dyn_console_fixture.o -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath "${{ github.workspace }}\target\et_dyn_console_fixture")) { throw 'Zig 未产出 ET_DYN fixture' }
      - name: 生成 glibc 道体权重（Linux 验收前置）
        if: runner.os == 'Linux'
        shell: bash
        run: cargo run -p daoti-core --bin glibc-knowledge -- knowledge/glibc_knowledge.jsonl
      - name: 生成 glibc 道体权重（Windows 验收前置）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p daoti-core --bin glibc-knowledge -- knowledge/glibc_knowledge.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'glibc 道体权重生成失败' }
          if (-not (Test-Path -LiteralPath knowledge/glibc_network.daotiblt)) { throw 'glibc 道体权重文件不存在' }
      - name: 校验静态 hello_libc.elf（受控 fixture：ET_EXEC 且无 PT_DYNAMIC/PT_INTERP）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath hello_libc.elf)) { throw 'hello_libc.elf 不存在（静态 smoke 受控 fixture，源码 hello_libc.c）' }
          # 64 位小端 ELF：e_type 位于 0x10，PH 表偏移 0x20，phentsize 0x36，phnum 0x38。
          $elfBytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath hello_libc.elf))
          $eType = [System.BitConverter]::ToUInt16($elfBytes, 0x10)
          Write-Output ("hello_libc.elf e_type=0x{0:X4} (2=EXEC 3=DYN)" -f $eType)
          if ($eType -ne 2) { throw ('hello_libc.elf 不是 ET_EXEC，实际 e_type=0x{0:X4}' -f $eType) }
          $phoff = [System.BitConverter]::ToUInt64($elfBytes, 0x20)
          $phentsize = [System.BitConverter]::ToUInt16($elfBytes, 0x36)
          $phnum = [System.BitConverter]::ToUInt16($elfBytes, 0x38)
          $dynamicHeaderTypes = @()
          for ($i = 0; $i -lt $phnum; $i++) {
            $off = [int]($phoff + $i * $phentsize)
            $pType = [System.BitConverter]::ToUInt32($elfBytes, $off)
            # 2=PT_DYNAMIC，3=PT_INTERP：任一存在都会被 CLI 判为动态 ELF
            if ($pType -eq 2 -or $pType -eq 3) { $dynamicHeaderTypes += $pType }
          }
          if ($dynamicHeaderTypes.Count -gt 0) {
            throw ('hello_libc.elf 含动态程序头 PT_DYNAMIC/PT_INTERP：{0}，会被 CLI 误判为动态 ELF' -f ($dynamicHeaderTypes -join ','))
          }
          Write-Output 'hello_libc.elf 程序头无 PT_DYNAMIC/PT_INTERP，将被识别为静态 ELF'
      - name: 生成真实 TLS 动态 ELF fixture（Linux 工具链）
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-tls-dynamic-fixture.sh target/tls_dynamic
      - name: Linux 验收真实 TLS 动态取址链
        if: runner.os == 'Linux'
        shell: bash
        env:
          DAOTI_TRACE_TLS: '1'
        run: |
          cargo test -p daoti-core --lib load_and_run_real_tls_dynamic_chain -- --ignored --nocapture

      - name: Windows CLI 验收真实动态 ELF fixture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DAOTI_DYNAMIC_RUNTIME_ROOT: ${{ github.workspace }}
          DAOTI_DYNAMIC_RUNTIME_FIXTURE: ${{ github.workspace }}\target\et_dyn_console_fixture
          DAOTI_DYNAMIC_RUNTIME_EVIDENCE: passed
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = 'target/windows-dynamic-cli.log'
          cargo run -p daoti-cli -- run $env:DAOTI_DYNAMIC_RUNTIME_FIXTURE *> $logPath
          $cliExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $logPath -Encoding UTF8
          if ($cliExitCode -ne 0) { throw "Windows 动态 ELF CLI 失败，退出码=$cliExitCode；详见 $logPath" }
          cargo test -p daoti-cli --test cli_smoke --no-default-features -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows 动态 ELF smoke 测试失败' }
      - name: 上传 Windows 动态 ELF 诊断日志
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dynamic-elf-diagnostics
          path: target/windows-dynamic-cli.log
          if-no-files-found: ignore
      - name: Linux CLI 验收真实 ET_DYN fixture
        if: runner.os == 'Linux'
        shell: bash
        env:
          DAOTI_REQUIRE_ET_DYN_FIXTURE: '1'
        run: |
          cargo test -p daoti-cli --test cli_smoke --no-default-features
          cargo run -p daoti-cli -- dynamic-metadata target/et_dyn_console_fixture
      - name: 生成 Mach-O runtime fixture
        shell: pwsh
        run: python scripts/build-macho-console-fixture.py target/macho_console_fixture
      - name: 生成 macOS arm64 runtime fixture（HTTP 原生执行）
        if: runner.os == 'macOS'
        shell: pwsh
        run: python scripts/build-macho-console-fixture.py target/macho_console_fixture_arm64 arm64
      - name: 验收 Mach-O runtime 真实解释执行
        shell: pwsh
        run: cargo test -p daoti-core macho_runtime::tests::executes_real_macho_console_fixture --lib
      - name: 验收极简动态 ELF 第一竖切
        if: runner.os == 'Linux'
        run: cargo test -p daoti-core load_and_run_minimal_dynamic_hello_uses_native_interpreter --lib

      - name: 测试
        run: cargo test --workspace
      - name: 验收自包含 PE 解析、导入绑定与控制台执行
        run: cargo test -p daoti-core parser::pe::tests --lib
      - name: 验收 macOS 远程节点协议
        run: cargo test -p daoti-macos-node --lib
      - name: macOS 真实节点 HTTP 闭环验收
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          export DAOTI_MACOS_NODE_TOKEN='ci-real-node-token'
          export DAOTI_MACOS_NODE_ADDR='127.0.0.1:18767'
          cargo run -p daoti-macos-node --bin daoti-macos-node > target/macos-node-process.stdout 2> target/macos-node-process.stderr &
          node_pid=$!
          cleanup() {
            kill "$node_pid" 2>/dev/null || true
            wait "$node_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 1 -H "X-Daoti-Token: $DAOTI_MACOS_NODE_TOKEN" http://127.0.0.1:18767/health > target/macos-node-health.json; then
              break
            fi
            sleep 1
          done
          test -s target/macos-node-health.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          binary = Path('target/macho_console_fixture_arm64').read_bytes()
          request = {
              'request_id': 'ci-real-macos-http',
              'filename': 'macho_console_fixture',
              'binary_base64': base64.b64encode(binary).decode('ascii'),
              'args': [],
              'timeout_ms': 5000,
              'authentication': {'method': 'Token', 'credential_ref': 'ci-node'},
          }
          Path('target/macos-node-execute-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY
          set +e
          execute_http_code=$(curl --silent --show-error --max-time 10 \
            -H "X-Daoti-Token: $DAOTI_MACOS_NODE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @target/macos-node-execute-request.json \
            --output target/macos-node-real-evidence.log \
            --write-out '%{http_code}' \
            http://127.0.0.1:18767/execute)
          curl_exit_code=$?
          set -e
          cat target/macos-node-real-evidence.log
          test "$curl_exit_code" -eq 0 || { cat target/macos-node-process.stderr; exit "$curl_exit_code"; }
          test "$execute_http_code" -eq 200 || { cat target/macos-node-process.stderr; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('target/macos-node-real-evidence.log').read_text(encoding='utf-8'))
          assert result['status'] == 'Succeeded', result
          assert 'macho-runtime-ok' in result['stdout'], result
          assert result['exit_code'] == 7, result
          PY
          cat target/macos-node-process.stderr
      - name: macOS 真实节点单元验收
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p daoti-macos-node execute_requires_token_and_returns_process_result --lib -- --nocapture 2>&1 | tee target/macos-node-unit-evidence.log

      - name: 上传 macOS 真实节点证据
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-real-node-evidence
          path: |
            target/macos-node-real-evidence.log
            target/macos-node-unit-evidence.log
            target/macos-node-process.stdout
            target/macos-node-process.stderr
            target/macos-node-health.json
            target/macos-node-execute-request.json
          if-no-files-found: ignore

      - name: Clippy 静态检查（拒绝所有警告）
        run: cargo clippy --workspace -- -D warnings

  # 三平台验收门禁：每个平台都必须通过真实构建/测试，不将 mock 当作能力证明
  acceptance:
    name: 三平台真实能力门禁 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 检查能力注册表与统一报告契约
        run: cargo test -p daoti-core executor::execution::tests --lib
      - name: 能力探测门禁（仅记录真实探测结果）
        run: cargo run -p daoti-cli -- capabilities
      - name: CLI/daemon 入口契约
        run: cargo run -p daoti-cli -- --help
      - name: 验证全工作区可编译
        run: cargo check --workspace

  # 玄镜前端：Vite 生产构建 + 产物校验
  frontend:
    name: 玄镜前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daoti-ui-web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daoti-ui-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vite 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xuanjing-ui-dist
          path: daoti-ui-web/dist/
