[build]
# 在 CI/受限环境下关闭增量编译抖动
incremental = false

# 仅使用工作区相对路径，避免把本机绝对路径泄漏到 CI 环境。
target-dir = "target"

# Windows schannel 证书吊销检查失败（CRYPT_E_NO_REVOCATION_CHECK）的规避：
# 关闭 http 证书吊销检查，改用国内镜像加速（用户位于中国区网络）。
[http]
check-revoke = false

# crates.io 国内镜像（rsproxy.cn），加速依赖拉取并规避网络抖动
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
